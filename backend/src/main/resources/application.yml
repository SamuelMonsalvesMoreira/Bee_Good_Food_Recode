spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  application:
    name: bee-good-food-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 5000
      connection-init-sql: "SET time_zone = '+00:00', sql_mode = 'STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION'"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
  paths-to-match: /api/v1/**
bee:
  security:
    jwt-secret-base64: ${JWT_SECRET_BASE64}
    auth-requests-per-minute: 20
logging:
  level:
    # Conflitos esperados sao tratados em JSON; SQL pode conter e-mails.
    org.hibernate.orm.jdbc.error: OFF
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
